name: iOS Build & Release (Xcode 26)

on:
  push:
    branches:
      - main
      - ui-refresh
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Cody iOS (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout Cody
        uses: actions/checkout@v4

      - name: Select Xcode 26
        id: xcode
        run: |
          set -euo pipefail
          ls -ld /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          XCODE_VER=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "version=$XCODE_VER" >> "$GITHUB_OUTPUT"

      - name: Ensure Metal Toolchain
        run: |
          set -euo pipefail
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Resolve ish-arm64 HEAD SHA
        id: ish_sha
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/OpenMinis/ish-arm64.git HEAD | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ish-arm64 HEAD: $SHA"

      - name: Restore native dependencies cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/resources
            deps/frameworks
            deps/lame-build
          key: ios-native-deps-v1-xcode${{ steps.xcode.outputs.version }}-${{ steps.ish_sha.outputs.sha }}-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh', 'deps/rclone-mobile/go.sum', 'deps/ffmpeg-patch/**') }}

      - name: Install native build tools (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install meson ninja llvm libarchive pkg-config

      - name: Clone ish-arm64 into deps/ish (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf deps/ish
          git clone --depth 1 --recursive --branch master https://github.com/OpenMinis/ish-arm64.git deps/ish

      - name: Build LAME & FFmpeg (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh

      - name: Build iSH-ARM64 & Alpine rootfs (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Build Rclone XCFramework (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ./deps/build_rclone_ios.sh

      - name: Ensure ProviderCustomization.xcconfig exists
        run: |
          set -euo pipefail
          if [ ! -f src/ios/Configs/ProviderCustomization.xcconfig ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          fi

      - name: Restore SwiftPM cache
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ios-spm-v1-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('src/ios/Cody.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-spm-v1-xcode${{ steps.xcode.outputs.version }}-

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(xcodebuild -project src/ios/Cody.xcodeproj -scheme Cody -configuration Release -showBuildSettings 2>/dev/null | awk '/^[[:space:]]*MARKETING_VERSION = /{print $3; exit}')
            VER="${VER:-0.1.0}"
          fi
          CONFIG="${{ inputs.configuration || 'Release' }}"
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "Building Cody $VER ($CONFIG)"

      - name: Build Cody iOS with Xcode 26
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild build \
            -project src/ios/Cody.xcodeproj \
            -scheme Cody \
            -configuration "${{ steps.version.outputs.config }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log
        shell: bash

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/${{ steps.version.outputs.config }}-iphoneos/Cody.app"
          test -d "$APP_PATH"
          IPA_NAME="Cody-${{ steps.version.outputs.value }}-unsigned.ipa"
          rm -rf build/ipa Payload
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/Cody.app
          (cd build/ipa && zip -r -y "../$IPA_NAME" Payload >/dev/null)
          ls -lh "build/$IPA_NAME"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=build/$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_id }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cody-${{ steps.version.outputs.value }}-${{ steps.version.outputs.config }}-unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          IPA="${{ steps.package.outputs.ipa_path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Cody $TAG" \
              --generate-notes
          fi
